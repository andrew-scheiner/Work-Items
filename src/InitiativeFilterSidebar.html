<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      :root {
        --bg: #f7f4ed;
        --panel: #ffffff;
        --text: #1e2723;
        --muted: #5f6f66;
        --accent: #1d6f42;
        --accent-strong: #14512f;
        --border: #d8dfd9;
      }

      body {
        margin: 0;
        padding: 16px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top right, #e8f1e5, var(--bg) 60%);
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 14px;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.07);
      }

      h2 {
        margin: 0 0 8px;
        font-size: 16px;
      }

      p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.4;
      }

      .field-list {
        display: grid;
        gap: 10px;
        margin-bottom: 12px;
      }

      .field-row {
        display: grid;
        gap: 4px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
      }

      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fff;
        color: var(--text);
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-top: 12px;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 9px 10px;
        font-weight: 600;
        cursor: pointer;
      }

      .apply {
        background: var(--accent);
        color: #fff;
      }

      .apply:hover {
        background: var(--accent-strong);
      }

      .clear {
        background: #e8ece9;
        color: var(--text);
      }

      .status {
        margin-top: 10px;
        min-height: 18px;
        font-size: 12px;
        color: var(--muted);
      }

      .error {
        color: #a1260d;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>WorkItems Filter</h2>
      <p>Enter values for any fields below. Any populated field will be used to filter the WorkItems sheet.</p>

      <div id="fieldList" class="field-list"></div>

      <div class="actions">
        <button class="apply" onclick="applyFilter()">Apply</button>
        <button class="clear" onclick="clearFilter()">Clear</button>
      </div>

      <div id="status" class="status"></div>
    </div>

    <script>
      let columns = [];

      function setStatus(message, isError) {
        const status = document.getElementById('status');
        status.textContent = message || '';
        status.className = isError ? 'status error' : 'status';
      }

      function renderFields(items) {
        const container = document.getElementById('fieldList');
        container.innerHTML = '';

        items.forEach(function(column) {
          const row = document.createElement('div');
          row.className = 'field-row';

          const label = document.createElement('label');
          label.textContent = column;
          label.setAttribute('for', 'field-' + column.replace(/[^a-z0-9]+/gi, '-').toLowerCase());

          const input = document.createElement('input');
          input.id = label.getAttribute('for');
          input.type = 'text';
          input.setAttribute('data-column', column);

          row.appendChild(label);
          row.appendChild(input);
          container.appendChild(row);
        });
      }

      function loadColumns() {
        setStatus('Loading fields...');
        google.script.run
          .withSuccessHandler(function(items) {
            columns = items || [];
            renderFields(columns);
            setStatus('Ready');
          })
          .withFailureHandler(function(err) {
            setStatus(err && err.message ? err.message : 'Failed to load fields.', true);
          })
          .getWorkItemsFilterColumns();
      }

      function collectFilters() {
        const filters = {};
        const inputs = document.querySelectorAll('#fieldList input[data-column]');

        inputs.forEach(function(input) {
          const column = input.getAttribute('data-column');
          const value = input.value.trim();
          if (column && value) {
            filters[column] = value;
          }
        });

        return filters;
      }

      function applyFilter() {
        const filters = collectFilters();
        setStatus('Applying filter...');

        google.script.run
          .withSuccessHandler(function() {
            setStatus(Object.keys(filters).length ? 'Filter applied.' : 'Filter cleared.');
          })
          .withFailureHandler(function(err) {
            setStatus(err && err.message ? err.message : 'Failed to apply filter.', true);
          })
          .filterWorkItemsByFields(filters);
      }

      function clearFilter() {
        const inputs = document.querySelectorAll('#fieldList input[data-column]');
        inputs.forEach(function(input) {
          input.value = '';
        });
        applyFilter();
      }

      loadColumns();
    </script>
  </body>
</html>
